# ─────────────────────────────────────────────────────────────
# إصدار كامل (APK) — تشغّله يدوياً من تبويب Actions.
# • إذا كان SHOREBIRD_TOKEN موجود: يبني بـ Shorebird (يدعم التحديث عن بُعد).
# • إذا لم يكن موجود: يبني APK عادي (بدون تحديث كود عن بُعد).
# الـ APK يُرفع إلى GitHub Releases.
# تحتاج إصدار كامل جديد فقط عند تغيير كود Native / إضافة Plugin جديدة.
# ─────────────────────────────────────────────────────────────
name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔑 Android signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.p12
          PROPS

      - name: 🏷️ Read version
        id: ver
        run: |
          v=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v${v//+/-build}" >> "$GITHUB_OUTPUT"

      # ───────── مسار Shorebird (تحديث عن بُعد) ─────────
      - name: 🐦 Setup Shorebird
        if: ${{ env.SHOREBIRD_TOKEN != '' }}
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 🐦 Shorebird init (first time only)
        if: ${{ env.SHOREBIRD_TOKEN != '' && hashFiles('shorebird.yaml') == '' }}
        run: |
          shorebird init --force --display-name "Todo OTA"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git commit -m "chore: shorebird init [skip ci]"
          git push

      - name: 🚀 Shorebird release (APK)
        if: ${{ env.SHOREBIRD_TOKEN != '' }}
        run: shorebird release android --artifact apk

      # ───────── مسار بديل بدون Shorebird ─────────
      - name: 🐤 Setup Flutter
        if: ${{ env.SHOREBIRD_TOKEN == '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 🏗️ flutter build apk
        if: ${{ env.SHOREBIRD_TOKEN == '' }}
        run: |
          echo "::warning::SHOREBIRD_TOKEN غير موجود — هذا APK بدون تحديث كود عن بُعد."
          flutter build apk --release

      - name: 📦 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: مهامي ${{ steps.ver.outputs.version }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            📥 حمّل `app-release.apk` وثبّته على جوالك.
            ${{ env.SHOREBIRD_TOKEN != '' && '✅ هذه النسخة تدعم التحديث عن بُعد (Shorebird).' || '⚠️ هذه النسخة بدون Shorebird — أضف SHOREBIRD_TOKEN ثم أعد التشغيل.' }}
