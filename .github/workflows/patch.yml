# ─────────────────────────────────────────────────────────────
# تحديث عن بُعد (Code Push) — يعمل تلقائياً عند أي push على main
# يغيّر ملفات lib/ . المستخدم يستلم التحديث بدون تحميل APK.
# ─────────────────────────────────────────────────────────────
name: Shorebird Patch (OTA)

on:
  push:
    branches: [main]
    paths: ['lib/**', 'assets/**']
  workflow_dispatch:

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: 🔎 Check prerequisites
        id: pre
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::warning::SHOREBIRD_TOKEN غير موجود في Secrets — تم تخطي الـ patch."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f shorebird.yaml ]; then
            echo "::warning::لا يوجد shorebird.yaml — شغّل workflow 'Release APK' أولاً."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ☕ Java 17
        if: steps.pre.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔑 Android signing
        if: ${{ steps.pre.outputs.ok == 'true' && env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.p12
          PROPS

      - name: 🐦 Setup Shorebird
        if: steps.pre.outputs.ok == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 🚀 Shorebird patch
        if: steps.pre.outputs.ok == 'true'
        run: shorebird patch android --release-version=latest --allow-asset-diffs
