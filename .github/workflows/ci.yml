name: CI (فحص وتجربة)

on:
  pull_request:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.yaml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
